name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20.19', 22, 24]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # fails below 100 % lines, branches or functions
            - run: npm run test:coverage

    # the tarball as npm would publish it, installed into an empty project and loaded both ways
    package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            # as the release workflow does
            - run: npm install -g npm@latest
            - run: npm ci
            - run: npm run test:package
